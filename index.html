<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Betinhos | Teste de publicação</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #fcfcfb;
        color: #10253f;
        display: grid;
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }
      main { margin: auto; max-width: 620px; text-align: center; }
      .mark { color: #b58a36; font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { font-family: Georgia, serif; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1; margin: 20px 0; }
      p { color: #4c5b6a; font-size: 1.125rem; line-height: 1.6; margin: 0 auto; max-width: 510px; }
      .status { border-top: 1px solid #dfe3e5; color: #587063; font-size: .875rem; margin-top: 40px; padding-top: 20px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Betinhos Executive Service</div>
      <h1>Publicação em teste</h1>
      <p>Se esta página aparece, o deploy automático do GitHub para a Locaweb está funcionando.</p>
      <div class="status">GitHub Actions • Locaweb • ambiente de teste</div>
    </main>
  </body>
</html>
