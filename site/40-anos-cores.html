<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#061d33" />
    <link rel="icon" type="image/png" href="/assets/logo-betinhos-b.png" />
    <link rel="stylesheet" href="/40-anos-opcoes.css" />
    <link rel="stylesheet" href="/40-anos-cores.css" />
    <title>Comparação de cores — 40 anos | Betinhos</title>
  </head>
  <body>
    <header class="comparison-header">
      <a href="/" class="comparison-brand" aria-label="Betinhos — página inicial" data-i18n-aria="homeLabel">
        <img src="/logo-betinhos.png" alt="Betinhos Executive Service" />
      </a>
      <div class="comparison-language" role="group" aria-label="Idioma" data-i18n-aria="langLabel">
        <button type="button" data-lang="pt" aria-pressed="true">PT</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
      </div>
    </header>

    <main>
      <header class="comparison-intro">
        <p data-i18n="eyebrow">Comparação de cor</p>
        <h1 data-i18n="title">A mesma assinatura.<br />Duas leituras.</h1>
      </header>

      <section class="color-models" aria-label="Modelos de cor" data-i18n-aria="modelsLabel">
        <article class="color-model color-model--dark">
          <header>
            <span>01</span>
            <h2 data-i18n="darkTitle">Número dourado<br />ANOS branco</h2>
          </header>
          <div class="anniversary-lockup anniversary-lockup--color" role="img" aria-label="40 anos, número dourado e texto branco" data-i18n-aria="darkMarkLabel">
            <span class="anniversary-number" aria-hidden="true">
              <i class="anniversary-zero">0</i>
              <i class="anniversary-four">4</i>
            </span>
            <span class="anniversary-cut" aria-hidden="true">ANOS</span>
          </div>
        </article>

        <article class="color-model color-model--light">
          <header>
            <span>02</span>
            <h2 data-i18n="lightTitle">Número azul<br />ANOS dourado</h2>
          </header>
          <div class="anniversary-lockup anniversary-lockup--color" role="img" aria-label="40 anos, número azul e texto dourado" data-i18n-aria="lightMarkLabel">
            <span class="anniversary-number" aria-hidden="true">
              <i class="anniversary-zero">0</i>
              <i class="anniversary-four">4</i>
            </span>
            <span class="anniversary-cut" aria-hidden="true">ANOS</span>
          </div>
        </article>
      </section>
    </main>

    <script src="/40-anos-cores.js"></script>
  </body>
</html>
